		<script>
// Fungsi untuk mendapatkan posisi pengguna
function setCurrentLocationAsOrigin(callback) {
    if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(function(pos) {
            const lonLat = [pos.coords.longitude, pos.coords.latitude];
            const origin = ol.proj.fromLonLat(lonLat);
            callback(origin);
        }, function(err) {
            console.error('Geolocation error:', err.message);
            alert('Tidak dapat mengambil posisi Anda.');
        }, {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        });
    } else {
        alert('Geolocation tidak didukung browser Anda.');
    }
}
</script>
		<script>
    // Wait for map to be initialized
    window.addEventListener('load', function() {
    setTimeout(function() {
        initializeLocationSearch();
        initializeRoutingControl();    // ← Panggil inisialisasi routing di sini
    }, 1000);
});
    
    function initializeLocationSearch() {
        const searchBtn = document.getElementById('locationSearchBtn');
        const dropdown = document.getElementById('locationDropdown');
        const locationItems = document.querySelectorAll('.location-item');
        
        // Toggle dropdown visibility
        searchBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            dropdown.classList.toggle('show');
        });
        
        // Close dropdown when clicking outside
        document.addEventListener('click', function() {
            dropdown.classList.remove('show');
        });
        
        // Handle location selection
        locationItems.forEach(function(item) {
            item.addEventListener('click', function() {
            const coords = JSON.parse(this.getAttribute('data-coords'));
            const zoom = parseInt(this.getAttribute('data-zoom'));
            searchBtn.textContent = this.textContent.trim();
            dropdown.classList.remove('show');
            navigateToLocation(coords, zoom);

            // Update routing dengan origin dinamis dan tujuan baru
            setCurrentLocationAsOrigin(function(origin) {
                const destination = ol.proj.fromLonLat(coords);
                window.routingControl.setWaypoints([ origin, destination ]);
            });
        });
    });
}
</script>
<script>
    function navigateToLocation(coords, zoom) {
        // Transform coordinates to map projection (usually Web Mercator)
        const transformedCoords = ol.proj.fromLonLat(coords);
        
        // Get the map view
        const view = map.getView();
        
        // Animate to location
        view.animate({
            center: transformedCoords,
            zoom: zoom,
            duration: 1500, // Animation duration in milliseconds
            easing: ol.easing.easeInOut
        });
    }
	function initializeRoutingControl() {
    window.routingControl = new ol.control.RoutingMachine({
        service: 'https://api.openrouteservice.org/v2/directions/driving-car',
        apiKey: 'YOUR_ORS_API_KEY',
        position: 'top-right',
        routeLineStyle: { styles: [{ stroke: '#ff0000', width: 4 }] },
        addWaypoints: true,
        draggableWaypoints: true,
        fitSelectedRoutes: true
    });
    map.addControl(window.routingControl);

    // Set origin dinamis
    setCurrentLocationAsOrigin(function(origin) {
        window.routingControl.setWaypoints([ origin, origin ]);
    });
}
item.addEventListener('click', function() {
    const coords = JSON.parse(this.getAttribute('data-coords'));
    const zoom = parseInt(this.getAttribute('data-zoom'));
    searchBtn.textContent = this.textContent.trim();
    dropdown.classList.remove('show');
    navigateToLocation(coords, zoom);

    // ← Update tujuan routing di sini
    if (window.routingControl) {
        const origin = window.routingControl.getWaypoints()[0];
        const dest   = ol.proj.fromLonLat(coords);
        window.routingControl.setWaypoints([ origin, dest ]);
    }
});
    </script>
